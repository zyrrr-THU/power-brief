# 每次推送代码时自动运行离线自测（不联网、不推送）
name: tests

on:
  push:
    paths: ["powerbrief/**", "tests/**", "*.yaml", "requirements.txt"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tests/test_offline.py
